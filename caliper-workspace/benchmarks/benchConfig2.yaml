test:
  name: certificate-comprehensive-scaling-test
  description: اختبار شامل لقياس أداء إصدار وتحقق واستعلام الشهادات باستخدام SHA-3 وECDSA.
  workers:
    type: local
    number: 1 # نصيحة تقنية: استخدامه 1 يمنع اختناق المعالج عند حساب التواقيع الرقمية
  rounds:
    # --- القسم الأول: إصدار الشهادات (عمليات الكتابة - أثقل العمليات) ---
    - label: Issue-Cert-50TPS
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/issueCertificate.js

    - label: Issue-Cert-100TPS
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/issueCertificate.js

    - label: Issue-Cert-200TPS
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workload/issueCertificate.js

    # --- القسم الثاني: التحقق الفوري (عمليات حسابية - متوسطة الثقل) ---
    - label: Verify-Cert-Scaling
      description: اختبار قدرة النظام على التحقق من صحة الهاش عند ضغط 150 TPS.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 150
      workload:
        module: workload/verifyCertificate.js

    # --- القسم الثالث: الاستعلام الشامل (عمليات القراءة - الأخف بفضل Pagination) ---
    - label: Query-All-Pagination-Final
      description: الاستعلام عن كافة الشهادات باستخدام تقنية التقسيم لضمان ثبات الأداء.
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 100
      workload:
        module: workload/queryAllCertificates.js
