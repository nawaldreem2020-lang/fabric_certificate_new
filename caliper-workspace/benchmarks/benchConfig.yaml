test:
  name: certificate-comprehensive-scaling-test
  description: اختبار شامل لقياس أداء إصدار وتحقق واستعلام الشهادات باستخدام SHA-3 وECDSA.
  workers:
    type: local
    number: 1 
  rounds:
    # المرحلة 1: اختبار الاستقرار (معدل منخفض)
    - label: Issue-Cert-Stable-20TPS
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 20 #
      workload:
        module: workload/issueCertificate.js

    # المرحلة 2: اختبار التدرج (معدل متوسط)
    - label: Issue-Cert-Scaling-50TPS
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 50
      workload:
        module: workload/issueCertificate.js

    # المرحلة 3: اختبار التحقق (منهجية عمر سعد)
    - label: Verify-Cert-Performance
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/verifyCertificate.js

    # المرحلة 4: اختبار الاستعلام بالتقسيم (Pagination)
    - label: Query-All-Pagination-Final
      txDuration: 30
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workload/queryAllCertificates.js
